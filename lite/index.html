<title>星星工作台</title>

<style>
:root{
  --bg:#f7f5fa;--card:#fff;--sidebar:#fff;
  --text:#1f2937;--text2:#6b7280;--text3:#9ca3af;
  --border:#ece8f0;--border2:#ddd6e6;
  --primary:#ec4899;--primary-bg:#fdf2f8;--primary-hover:#db2777;
  --success:#10b981;--success-bg:#ecfdf5;
  --warning:#f59e0b;--warning-bg:#fffbeb;
  --danger:#ef4444;--danger-bg:#fef2f2;
  --info:#3b82f6;--info-bg:#eff6ff;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
  --cat-work:#3b82f6;--cat-personal:#ec4899;--cat-study:#10b981;--cat-health:#f59e0b;--cat-other:#6b7280;--cat-love:#e11d48;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

.app{display:flex;height:100vh}

/* ===== Sidebar ===== */
.sidebar{width:240px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 24px 20px;border-bottom:1px solid var(--border)}
.brand-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.brand-text{font-size:16px;font-weight:600;color:var(--text)}
.nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--radius-sm);color:var(--text2);font-size:14px;font-weight:500;transition:all .15s;text-align:left;width:100%}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-bg);color:var(--primary)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.add-task-btn{margin:0 16px 12px;padding:11px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:500;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.add-task-btn:hover{background:var(--primary-hover)}
.sidebar-footer{padding:0 16px;border-top:1px solid var(--border);padding-top:12px;display:flex;gap:8px}
.footer-btn{flex:1;padding:8px;border-radius:var(--radius-sm);font-size:13px;color:var(--text2);border:1px solid var(--border);transition:all .15s}
.footer-btn:hover{border-color:var(--border2);color:var(--text);background:var(--bg)}

/* ===== Main ===== */
.main{flex:1;overflow-y:auto;padding:32px 40px}
.view{display:none;animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.page-title{font-size:22px;font-weight:600;margin-bottom:24px}

/* ===== Dashboard ===== */
.greeting{font-size:22px;font-weight:600;margin-bottom:4px}
.greeting-date{font-size:14px;color:var(--text2);margin-bottom:24px}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stat-card-label{font-size:13px;color:var(--text2);margin-bottom:8px}
.stat-card-value{font-size:28px;font-weight:700}
.stat-card-value.today{color:var(--primary)}
.stat-card-value.pending{color:var(--warning)}
.stat-card-value.progress{color:var(--info)}
.stat-card-value.done{color:var(--success)}
.progress-section{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:24px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.progress-title{font-size:15px;font-weight:600}
.progress-pct{font-size:14px;font-weight:600;color:var(--primary)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s ease}
.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.panel{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.panel-title{font-size:15px;font-weight:600}
.panel-link{font-size:13px;color:var(--primary);cursor:pointer}
.panel-link:hover{text-decoration:underline}
.upcoming-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.upcoming-item:last-child{border-bottom:none}
.upcoming-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.upcoming-info{flex:1;min-width:0}
.upcoming-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upcoming-meta{font-size:12px;color:var(--text2)}
.upcoming-badges{display:flex;gap:6px;flex-shrink:0}
.upcoming-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.upcoming-item:hover .upcoming-actions{opacity:1}
.upcoming-act-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.upcoming-act-btn:hover{background:var(--bg)}
.upcoming-act-btn.del:hover{background:var(--danger-bg);color:var(--danger)}
.upcoming-act-btn svg{width:14px;height:14px}
.panel-add-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);border:1px solid var(--border);transition:all .15s;margin-left:8px}
.panel-add-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}
.panel-add-btn svg{width:16px;height:16px}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.badge-cat{color:#fff}
.badge-pri-high{background:var(--danger-bg);color:var(--danger)}
.badge-pri-medium{background:var(--warning-bg);color:var(--warning)}
.badge-pri-low{background:#f0fdfa;color:#14b8a6}
.empty-state{text-align:center;padding:32px 0;color:var(--text3);font-size:14px}

.cat-bar-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.cat-bar-label{width:48px;font-size:13px;color:var(--text2);flex-shrink:0}
.cat-bar-track{flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:4px;transition:width .4s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:600;min-width:24px}

/* ===== Calendar ===== */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-month{font-size:18px;font-weight:600;min-width:120px;text-align:center}
.cal-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .15s}
.cal-btn:hover{background:var(--bg);border-color:var(--border2)}
.cal-today-btn{padding:6px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:13px;transition:all .15s}
.cal-today-btn:hover{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal-head{background:var(--bg);padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--text2)}
.cal-day{background:var(--card);min-height:96px;padding:8px;cursor:pointer;transition:background .1s;position:relative}
.cal-day:hover{background:var(--bg)}
.cal-day.other-month{background:#fafafa;color:var(--text3)}
.cal-day.other-month .day-num{color:var(--text3)}
.cal-day.today{background:var(--primary-bg)}
.cal-day.today .day-num{color:var(--primary);font-weight:700}
.cal-day.selected{box-shadow:inset 0 0 0 2px var(--primary)}
.day-num{font-size:13px;font-weight:500;margin-bottom:4px}
.day-dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%}
.day-more{font-size:10px;color:var(--text3)}
.day-task-label{font-size:11px;padding:1px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 法定节假日标记：放假日数字变红 + 节日名标签，调休补班日显示"班" */
.cal-day.holiday:not(.today) .day-num{color:#e02424;font-weight:600}
.holiday-name{font-style:normal;font-size:10px;font-weight:600;color:#e02424;background:rgba(224,36,36,.09);border-radius:3px;padding:1px 3px;margin-right:4px;vertical-align:1px;display:inline-block;line-height:1.35}
.work-tag{font-style:normal;font-size:9px;font-weight:500;color:#8a94a6;border:1px solid #cdd5e0;border-radius:3px;padding:0 2px;margin-left:4px;vertical-align:1px;line-height:1.5}

/* ===== Task List ===== */
.task-toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:border .15s}
.search-box input:focus{border-color:var(--primary)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3)}
.filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--card);cursor:pointer;transition:border .15s}
.filter-select:focus{border-color:var(--primary)}
/* 状态筛选：多选标签 */
.status-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status-chip{padding:8px 13px;border:1px solid var(--border);border-radius:999px;font-size:13px;background:var(--card);color:var(--text2);transition:all .15s;white-space:nowrap;cursor:pointer}
.status-chip:hover{border-color:var(--primary);color:var(--primary)}
.status-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500}
.task-table{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.task-row{display:grid;grid-template-columns:36px 1fr 80px 80px 130px 90px 80px;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);transition:background .1s;min-height:52px}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:var(--bg)}
.task-row.completed .task-title{text-decoration:line-through;color:var(--text3)}
.task-head{font-size:12px;color:var(--text2);font-weight:600;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.task-checkbox{width:20px;height:20px;border:2px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;justify-self:center}
.task-checkbox:hover{border-color:var(--primary)}
.task-checkbox.checked{background:var(--success);border-color:var(--success)}
.task-checkbox.in-progress{border-color:var(--info);background:var(--info-bg)}
.task-checkbox.in-progress::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--info)}
.task-checkbox.checked svg{width:12px;height:12px;color:#fff}
.task-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-desc{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-completed-at{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--success);margin-top:3px;white-space:nowrap}
.task-completed-at svg{width:11px;height:11px;flex:none}
.task-actions{display:flex;gap:8px;justify-content:center}
.task-action-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text2)}
.task-action-btn:hover{background:var(--bg)}
.task-action-btn.delete:hover{background:var(--danger-bg);color:var(--danger)}
.task-action-btn svg{width:15px;height:15px}

/* ===== Stats ===== */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stats-panel{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.stats-panel-title{font-size:15px;font-weight:600;margin-bottom:20px}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:32px}
.donut{width:140px;height:140px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
.donut-hole{position:absolute;width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-pct{font-size:26px;font-weight:700;color:var(--primary)}
.donut-label{font-size:12px;color:var(--text2)}
.donut-legend{display:flex;flex-direction:column;gap:10px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-val{margin-left:auto;font-weight:600;color:var(--text)}
.bar-chart{display:flex;flex-direction:column;gap:12px}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.trend-chart{display:flex;align-items:flex-end;justify-content:space-between;height:160px;gap:12px;padding-top:20px}
.trend-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.trend-bar{width:100%;max-width:40px;border-radius:6px 6px 0 0;min-height:4px;transition:height .4s ease;position:relative}
.trend-bar-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--text2)}
.trend-bar-label{font-size:12px;color:var(--text2)}
.stats-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.summary-card{text-align:center;padding:16px;background:var(--bg);border-radius:var(--radius-sm)}
.summary-val{font-size:24px;font-weight:700;margin-bottom:4px}
.summary-label{font-size:13px;color:var(--text2)}

/* ===== Archive (已完成存档) ===== */
.archive-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.archive-summary-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:center}
.archive-summary-val{font-size:28px;font-weight:700;margin-bottom:4px}
.archive-summary-label{font-size:13px;color:var(--text2)}
.archive-toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.archive-group{margin-bottom:24px}
.archive-group-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.archive-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.archive-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--shadow);transition:box-shadow .15s;position:relative}
.archive-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.archive-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.archive-check{width:22px;height:22px;border-radius:6px;background:var(--success);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.archive-check svg{width:14px;height:14px;color:#fff}
.archive-card-title{font-size:14px;font-weight:500;text-decoration:line-through;color:var(--text3);flex:1;word-break:break-word}
.archive-card-desc{font-size:12px;color:var(--text3);margin-bottom:10px;padding-left:32px;word-break:break-word}
.archive-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:32px}
.archive-meta-item{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.archive-meta-item svg{width:12px;height:12px}
.archive-card-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.archive-card:hover .archive-card-actions{opacity:1}
.archive-act-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text2)}
.archive-act-btn:hover{background:var(--bg)}
.archive-act-btn.restore:hover{background:var(--info-bg);color:var(--info)}
.archive-act-btn.del:hover{background:var(--danger-bg);color:var(--danger)}
.archive-act-btn svg{width:14px;height:14px}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border-radius:var(--radius);width:520px;max-width:90vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:600}
.modal-close{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-body{padding:24px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:border .15s}
.form-input:focus{border-color:var(--primary)}
.form-hint{font-size:12px;color:var(--text3);margin-top:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--border)}
.btn{padding:9px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all .15s}
.btn-cancel{background:var(--bg);color:var(--text2)}
.btn-cancel:hover{background:var(--border)}
.btn-save{background:var(--primary);color:#fff}
.btn-save:hover{background:var(--primary-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;background:var(--text);color:#fff;padding:10px 24px;border-radius:var(--radius-sm);font-size:14px;z-index:2000;transition:transform .3s ease,opacity .25s ease;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== Cloud Sync ===== */
.sync-status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;background:var(--bg);border:1px solid var(--border)}
.sync-status.syncing{background:var(--warning-bg);border-color:#fcd34d}
.sync-status.success{background:var(--success-bg);border-color:#6ee7b7}
.sync-status.error{background:var(--danger-bg);border-color:#fca5a5}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--text3)}
.sync-dot.ok{background:var(--success)}
.sync-dot.err{background:var(--danger)}
.sync-dot.idle{background:var(--text3)}
.sync-spinner{width:14px;height:14px;border:2px solid var(--warning);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-status-text{flex:1;color:var(--text2);line-height:1.5}
.sync-code{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.6;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text2);resize:none;word-break:break-all}
.sync-code:focus{border-color:var(--primary);outline:none}
.sync-btn-row{display:flex;gap:8px;margin-top:10px}
.sync-mini-btn{flex:1;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;background:var(--primary);color:#fff;transition:all .15s}
.sync-mini-btn:hover{background:var(--primary-hover)}
.sync-mini-btn.ghost{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.sync-mini-btn.ghost:hover{background:var(--border);color:var(--text)}
.sync-tip{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.5}
.sync-warn{background:#fffbeb;border:1px solid #fcd34d;border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:#92400e;line-height:1.5;margin-top:10px}
/* 账号登录 / 注册 */
.sync-lead{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.sync-tabs{display:flex;gap:6px;padding:4px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:18px}
.sync-tab{flex:1;padding:8px 0;border:none;border-radius:calc(var(--radius-sm) - 2px);background:transparent;color:var(--text3);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.sync-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* Sync Modal */
.sync-modal{width:460px;max-width:90vw}
.sync-modal .modal-body{padding:24px}
.sync-form-item{margin-bottom:20px}
.sync-form-label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.sync-form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--card);color:var(--text);transition:border .15s}
.sync-form-input:focus{border-color:var(--primary)}
.sync-form-hint{font-size:12px;color:var(--text3);margin-top:4px}
.sync-guide{background:var(--bg);border-radius:var(--radius-sm);padding:16px;margin-top:16px}
.sync-guide-title{font-size:13px;font-weight:600;margin-bottom:12px}
.sync-guide-step{display:flex;gap:10px;margin-bottom:10px;font-size:12px;color:var(--text2);line-height:1.5}
.sync-guide-num{width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}

/* ===== iOS PWA Base ===== */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
.mobile-nav{display:none}
.fab{display:none}
.mobile-actions{display:none}

/* ===== Responsive / Mobile ===== */
@media(max-width:900px){
  .sidebar{display:none}

  /* Bottom Tab Bar */
  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;left:0;right:0;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-top:1px solid var(--border);
    padding:4px 0 calc(4px + env(safe-area-inset-bottom));
    z-index:100;
  }
  .mobile-nav .nav-item{
    flex:1;
    flex-direction:column;
    gap:2px;
    padding:6px 0 2px;
    font-size:10px;
    border-radius:8px;
    min-height:48px;
  }
  .mobile-nav .nav-item svg{width:24px;height:24px}
  .mobile-nav .nav-item.active{background:none;color:var(--primary)}

  /* FAB */
  .fab{
    display:flex;
    position:fixed;
    right:20px;
    bottom:calc(78px + env(safe-area-inset-bottom));
    width:52px;height:52px;
    border-radius:50%;
    background:linear-gradient(135deg,#fbbf24,#f59e0b);
    color:#fff;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 16px rgba(245,158,11,.45);
    z-index:99;
    transition:transform .15s;
  }
  .fab:active{transform:scale(.88)}

  /* Mobile action bar */
  .mobile-actions{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .mobile-actions button{
    flex:1;
    padding:9px 4px;
    border-radius:var(--radius-sm);
    background:var(--bg);
    font-size:12px;
    color:var(--text2);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }

  /* Main content area */
  .main{
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
  }

  /* Grids */
  .stat-cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .stat-card-value{font-size:22px}
  .stat-card-label{font-size:12px}
  .dashboard-grid{grid-template-columns:1fr;gap:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stats-row{grid-template-columns:1fr;gap:16px}
  .archive-summary{grid-template-columns:repeat(3,1fr);gap:10px}
  .archive-summary-card{padding:14px}
  .archive-summary-val{font-size:22px}
  .archive-cards{grid-template-columns:1fr}

  /* Typography */
  .page-title{font-size:18px;margin-bottom:16px}
  .greeting{font-size:20px}
  .greeting-date{font-size:13px;margin-bottom:16px}

  /* Calendar */
  .cal-day{min-height:60px;padding:4px}
  .day-num{font-size:12px}
  .day-task-label{font-size:9px;padding:1px 3px}
  .cal-toolbar{margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .cal-month{font-size:16px;min-width:90px}
  .cal-btn{width:36px;height:36px}
  .cal-today-btn{padding:8px 14px}
  .holiday-name{font-size:9px;padding:0 2px}
  .work-tag{font-size:8px}

  /* Task table -> 3 columns on mobile */
  .task-row{grid-template-columns:32px 1fr auto;gap:6px;padding:0 12px;min-height:50px}
  .task-row > :nth-child(3),
  .task-row > :nth-child(4),
  .task-row > :nth-child(5),
  .task-row > :nth-child(6){display:none}

  /* Task toolbar */
  .task-toolbar{gap:8px}
  .search-box{min-width:100%;order:0}
  .filter-select{flex:1;min-width:0;font-size:12px;padding:8px 8px}
  .status-chips{flex:1;min-width:100%;gap:6px}
  .status-chip{flex:1;text-align:center;padding:8px 6px;font-size:12px}

  /* Modal -> bottom sheet */
  .modal-overlay{align-items:flex-end}
  .modal{
    width:100%;max-width:100%;
    border-radius:20px 20px 0 0;
    max-height:88vh;
  }
  .modal-header{
    border-radius:20px 20px 0 0;
    padding-top:22px;
    position:relative;
  }
  .modal-header::before{
    content:'';
    position:absolute;
    top:8px;left:50%;
    transform:translateX(-50%);
    width:36px;height:4px;
    border-radius:2px;
    background:var(--border2);
  }
  .sync-modal{width:100%;max-width:100%}
  .sync-status{font-size:12px;padding:10px 12px}
  .sync-code{font-size:10px;padding:9px 10px}
  .sync-form-input{font-size:16px}
  .sync-lead{font-size:12px}
  .sync-btn-row{flex-direction:column}
  .form-row{grid-template-columns:1fr 1fr;gap:8px}
  .form-row-3{grid-template-columns:1fr}
  .modal-body{padding:16px}
  .modal-footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}

  /* Touch targets */
  .task-checkbox{width:24px;height:24px}
  .cal-btn,.cal-today-btn{min-height:36px}
  .nav-item{min-height:44px}
  .btn{padding:11px 20px}

  /* Panels */
  .panel{padding:16px}
  .stats-panel{padding:16px}

  /* Toast above bottom bar */
  .toast{bottom:calc(100px + env(safe-area-inset-bottom))}

  /* Donut */
  .donut{width:120px;height:120px}
  .donut-hole{width:82px;height:82px}
  .donut-pct{font-size:22px}

  /* Trend */
  .trend-chart{height:120px}

  /* Upcoming items */
  .upcoming-actions{opacity:1}

  /* Archive toolbar */
  .archive-toolbar{gap:8px}

  /* Progress */
  .progress-section{padding:16px}
}
@media(max-width:400px){
  .stat-cards{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .form-row-3{grid-template-columns:1fr}
}

<script>
/* 发布链接必需 sharecode：网关对每个请求的 URL 都校验它。
   这里统一给「云中转请求 + PWA 资源」自动补上 sharecode，用户无感。 */
(function(){
  try{
    var sc = new URLSearchParams(location.search).get('sharecode');
    if(!sc) return;
    var q = encodeURIComponent(sc);
    var m = document.querySelector('link[rel="manifest"]');
    if(m) m.href = m.getAttribute('href') + '?sharecode=' + q;
    var i = document.querySelector('link[rel="apple-touch-icon"]');
    if(i) i.href = i.getAttribute('href') + '?sharecode=' + q;
    var orig = window.fetch;
    if(typeof orig === 'function'){
      window.fetch = function(input, init){
        try{
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          if(url.indexOf('/api/crelay/') !== -1){
            var u = new URL(url, location.origin);
            if(!u.searchParams.has('sharecode')){
              u.searchParams.set('sharecode', sc);
              input = u.toString();
            }
            /* 平台网关会注入伪造的 Authorization 头，云后端会当成无效会话。
               把 SDK 的真实令牌挪到自定义头（网关不动自定义头），中转端再映射回去 */
            if(init && init.headers){
              var h = new Headers(init.headers);
              var auth = h.get('authorization');
              if(auth){
                h.set('x-wb-session-token', auth);
                h.delete('authorization');
                init.headers = h;
              }
            }
          }
        }catch(e){}
        return orig.call(this, input, init);
      };
    }
  }catch(e){}
})();
</script>

<script>
/* ====== State & Constants ====== */
const STORAGE_KEY = 'schedule-workbench-v1';
const CATS = {
  work:{label:'工作',color:'#3b82f6'},
  personal:{label:'个人',color:'#ec4899'},
  study:{label:'学习',color:'#10b981'},
  health:{label:'健康',color:'#f59e0b'},
  other:{label:'其他',color:'#6b7280'},
  love:{label:'伟大的爱情',color:'#e11d48'}
};
const PRIS = {
  high:{label:'高',color:'#ef4444',bg:'#fef2f2'},
  medium:{label:'中',color:'#f59e0b',bg:'#fffbeb'},
  low:{label:'低',color:'#14b8a6',bg:'#f0fdfa'}
};
const STATS = {
  pending:{label:'待办',color:'#6b7280'},
  'in-progress':{label:'进行中',color:'#3b82f6'},
  completed:{label:'已完成',color:'#10b981'}
};
// 任务列表展示顺序：进行中 → 待办 → 已完成
const STATUS_ORDER = {'in-progress':0, pending:1, completed:2};

const state = {
  tasks:[],
  view:'dashboard',
  calDate:new Date(),
  selectedDate:null,
  filters:{statuses:[],category:'all',priority:'all',search:''},
  editingId:null,
  calDayFilter:null,
  archiveFilters:{category:'all',search:''}
};

/* ====== Storage ====== */
const SYNC_ACCOUNT_KEY = 'starschedule-account-v1';   // 登录状态（账号 + 会话令牌）
const SYNC_TOMB_KEY = 'starschedule-sync-tombstones-v1';
const SYNC_DEVICE_KEY = 'starschedule-sync-device-v1';
const HAD_ACCOUNT_KEY = 'starschedule-had-account-v1';  // 这台设备用过账号后就不再塞示例任务
let syncState = {
  username: '',      // 显示用的账号名（手机号打码）
  phone: '',         // 登录用的手机号
  loggedIn: false,
  mode: 'login',     // 弹窗模式：login（密码）| register（注册）| otp（验证码登录）
  status: 'idle',    // idle | syncing | success | error
  message: '',
  lastSyncAt: null,
  busy: false,
  pushTimer: null,
  deviceId: '',
  pendingOtp: null,  // { phone, verificationId, isExistingUser }
  codeSentAt: 0,
  codeTimer: null
};

function loadTasks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state.tasks = raw ? JSON.parse(raw) : [];
  }catch(e){ state.tasks = []; }
}
function saveTasks(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks));
  debounceSyncPush();
}

/* ====== Utilities ====== */
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function dateStr(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function todayStr(){ return dateStr(new Date()); }
function greeting(){
  const h = new Date().getHours();
  if(h<6) return '凌晨好';
  if(h<9) return '早上好';
  if(h<12) return '上午好';
  if(h<14) return '中午好';
  if(h<18) return '下午好';
  if(h<22) return '晚上好';
  return '夜深了';
}
function weekdayName(d){
  return ['日','一','二','三','四','五','六'][d.getDay()];
}
function relativeDate(s){
  const today = todayStr();
  const tomorrow = dateStr(new Date(Date.now()+86400000));
  const afterTomorrow = dateStr(new Date(Date.now()+172800000));
  if(s===today) return '今天';
  if(s===tomorrow) return '明天';
  if(s===afterTomorrow) return '后天';
  const d = parseDate(s);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function fmtTime(t){
  if(!t) return '';
  return t;
}
// 任务完成日期：优先用实际完成时间戳，老数据回退到任务日期
function formatCompletedAt(t){
  if(!t) return '';
  if(t.completedAt){
    const d = new Date(t.completedAt);
    if(!isNaN(d.getTime())){
      const ds = dateStr(d);
      const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      if(ds===todayStr()) return `今天 ${hm}`;
      if(ds===dateStr(new Date(Date.now()-86400000))) return `昨天 ${hm}`;
      const y = d.getFullYear()!==new Date().getFullYear() ? `${d.getFullYear()}年` : '';
      return `${y}${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
    }
  }
  return t.date ? `${relativeDate(t.date)}（原定日）` : '未记录';
}
// 由「完成日期」输入值 + 原完成时间拼出时间戳（只改日期，保留原时分）
function composeCompletedAt(dateVal, prevIso){
  if(!dateVal) return prevIso || new Date().toISOString();
  const parts = dateVal.split('-').map(Number);
  const ref = prevIso ? new Date(prevIso) : new Date();
  const d = new Date(parts[0], parts[1]-1, parts[2], ref.getHours(), ref.getMinutes(), ref.getSeconds());
  return d.toISOString();
}
function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ====== Data Queries ====== */
function getTasksByDate(s){
  return state.tasks.filter(t=>t.date===s);
}
function getTodayTasks(){
  return getTasksByDate(todayStr());
}
function getUpcomingTasks(n){
  const today = todayStr();
  return state.tasks
    .filter(t=>t.date>=today && t.status!=='completed')
    .sort((a,b)=>{
      if(a.date!==b.date) return a.date.localeCompare(b.date);
      const pa = {high:0,medium:1,low:2}[a.priority];
      const pb = {high:0,medium:1,low:2}[b.priority];
      return pa-pb;
    })
    .slice(0, n);
}
function getFilteredTasks(){
  const f = state.filters;
  return state.tasks
    .filter(t=>{
      if(f.statuses.length && !f.statuses.includes(t.status)) return false;
      if(f.category!=='all' && t.category!==f.category) return false;
      if(f.priority!=='all' && t.priority!==f.priority) return false;
      if(f.search){
        const q = f.search.toLowerCase();
        if(!t.title.toLowerCase().includes(q) && !(t.description||'').toLowerCase().includes(q)) return false;
      }
      if(state.calDayFilter && t.date!==state.calDayFilter) return false;
      return true;
    })
    .sort((a,b)=>{
      // 状态优先：进行中 → 待办 → 已完成
      const sa = STATUS_ORDER[a.status], sb = STATUS_ORDER[b.status];
      if(sa!==sb) return sa-sb;
      if(a.date!==b.date) return a.date.localeCompare(b.date);
      if(a.startTime && b.startTime) return a.startTime.localeCompare(b.startTime);
      return 0;
    });
}

/* ====== View Switching ====== */
function switchView(view){
  state.view = view;
  document.querySelectorAll('.nav-item').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  render();
}

            const count = catCounts[key];
            if(count===0) return '';

              <div class="cat-bar-label">${cat.label}</div>
              <div class="cat-bar-track">
                <div class="cat-bar-fill" style="width:${count/maxCat*100}%;background:${cat.color}">${count}</div>
              </div>
            </div>`;
          }).join('')
        }
      </div>
    </div>
  `;
}

/* ====== Render: Calendar ====== */
/* ====== 中国法定节假日（按国务院放假安排）======
   off: [开始MM-DD, 结束MM-DD, 节日名] — 放假区间（区间内数字标红，首日显示节日名）
   work: ['MM-DD', ...] — 调休补班日（多为周末，显示"班"）
   注：2027 年安排待国务院 2026 年底公布后补充 */
const FESTIVAL_YEARS = {
  '2025':{
    off:[['01-01','01-01','元旦'],['01-28','02-04','春节'],['04-04','04-06','清明'],['05-01','05-05','劳动节'],['05-31','06-02','端午'],['10-01','10-08','国庆']],
    work:['01-26','02-08','04-27','09-28','10-11']
  },
  '2026':{
    off:[['01-01','01-03','元旦'],['02-15','02-23','春节'],['04-04','04-06','清明'],['05-01','05-05','劳动节'],['06-19','06-21','端午'],['09-25','09-27','中秋'],['10-01','10-07','国庆']],
    work:['01-04','02-14','02-28','05-09','09-20','10-10']
  }
};
function getFestival(y, m, d){
  const info = FESTIVAL_YEARS[String(y)];
  if(!info) return null;
  const md = `${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if(info.work.includes(md)) return {type:'work'};
  for(let i=0;i<info.off.length;i++){
    const seg = info.off[i];
    if(md>=seg[0] && md<=seg[1]) return {type:'holiday', name: md===seg[0]?seg[2]:''};
  }
  return null;
}

function renderCalendar(){
  const d = state.calDate;
  const year = d.getFullYear();
  const month = d.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayStr();
  const monthLabel = `${year}年${month+1}月`;

  const weekdays = ['日','一','二','三','四','五','六'];
  let cells = '';

  // Prev month trailing days
  const prevMonthDays = new Date(year, month, 0).getDate();
  for(let i=startOffset-1; i>=0; i--){
    cells += `<div class="cal-day other-month"><div class="day-num">${prevMonthDays-i}</div></div>`;
  }

  // Current month days
  for(let day=1; day<=daysInMonth; day++){
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayTasks = getTasksByDate(ds);
    const isToday = ds===today;
    const isSelected = ds===state.selectedDate;
    const fest = getFestival(year, month+1, day);
    let festCls = '';
    let numHtml = `<div class="day-num">${day}</div>`;
    if(fest){
      if(fest.type==='holiday'){
        festCls = ' holiday';
        numHtml = `<div class="day-num">${fest.name?`<span class="holiday-name">${fest.name}</span>`:''}${day}</div>`;
      }else{
        festCls = ' workday';
        numHtml = `<div class="day-num">${day}<span class="work-tag">班</span></div>`;
      }
    }
    cells += `<div class="cal-day${festCls} ${isToday?'today':''} ${isSelected?'selected':''}" onclick="onCalDayClick('${ds}')">
      ${numHtml}
      <div class="day-dots">
        ${dayTasks.slice(0,3).map(t=>{
          const cat = CATS[t.category];
          const done = t.status==='completed';
          return `<div class="day-task-label" style="background:${cat.color}20;color:${cat.color};text-decoration:${done?'line-through':'none'};opacity:${done?0.6:1}">${escapeHtml(t.title)}</div>`;
        }).join('')}
        ${dayTasks.length>3 ? `<span class="day-more">+${dayTasks.length-3} 更多</span>` : ''}
      </div>
    </div>`;
  }

  // Next month leading days
  const totalCells = startOffset + daysInMonth;
  const remaining = (7 - totalCells % 7) % 7;
  for(let i=1; i<=remaining; i++){
    cells += `<div class="cal-day other-month"><div class="day-num">${i}</div></div>`;
  }

  document.getElementById('view-calendar').innerHTML = `
    <div class="cal-toolbar">
      <div class="cal-nav">
        <button class="cal-btn" onclick="calPrev()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="cal-month">${monthLabel}</div>
        <button class="cal-btn" onclick="calNext()">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="cal-today-btn" onclick="calToday()">今天</button>
      </div>
      <button class="cal-today-btn" onclick="openModal(null,'${today}')">+ 添加今日任务</button>
    </div>
    <div class="cal-grid">
      ${weekdays.map(w=>`<div class="cal-head">${w}</div>`).join('')}
      ${cells}
    </div>
  `;
}

  state.calDate = new Date(state.calDate.getFullYear(), state.calDate.getMonth()-1, 1);

function renderStats(){

  const inProg = tasks.filter(t=>t.status==='in-progress').length;
  const pct = total>0 ? Math.round(completed/total*100) : 0;

  // Category distribution
  const catStats = {};
  Object.keys(CATS).forEach(k=>catStats[k]=0);
  tasks.forEach(t=>{ if(catStats[t.category]!==undefined) catStats[t.category]++; });
  const maxCat = Math.max(1, ...Object.values(catStats));

  // Priority distribution
  const priStats = {};
  Object.keys(PRIS).forEach(k=>priStats[k]=0);
  tasks.forEach(t=>{ if(priStats[t.priority]!==undefined) priStats[t.priority]++; });
  const maxPri = Math.max(1, ...Object.values(priStats));

  // 7-day trend
  const trend = [];
  for(let i=6; i>=0; i--){

            <div class="legend-item"><span class="legend-dot" style="background:#ece8f0"></span>未完成<span class="legend-val">${total-completed}</span></div>

        <div class="trend-chart">
          ${trend.map(t=>`
            <div class="trend-bar-wrap">
              <div class="trend-bar" style="height:${t.count/maxTrend*100}%;background:${t.isToday?'var(--primary)':'#fbcfe8'}">
                ${t.count>0 ? `<span class="trend-bar-val">${t.count}</span>` : ''}
              </div>

/* ====== Render: Archive (已完成存档) ====== */
function getCompletedTasks(){
  const f = state.archiveFilters;
  return state.tasks
    .filter(t=>t.status==='completed')
    .filter(t=>{
      if(f.category!=='all' && t.category!==f.category) return false;
      if(f.search){
        const q = f.search.toLowerCase();
        if(!t.title.toLowerCase().includes(q) && !(t.description||'').toLowerCase().includes(q)) return false;
      }
      return true;
    })
    .sort((a,b)=>{
      const da = a.completedAt || a.date;
      const db = b.completedAt || b.date;
      return db.localeCompare(da);
    });
}
function renderArchive(){
  const completed = state.tasks.filter(t=>t.status==='completed');
  const filtered = getCompletedTasks();
  const f = state.archiveFilters;

  // Stats
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0,0,0,0);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const weekCount = completed.filter(t=>{
    const d = t.completedAt ? new Date(t.completedAt) : new Date(t.date);
    return d >= weekStart;
  }).length;
  const monthCount = completed.filter(t=>{
    const d = t.completedAt ? new Date(t.completedAt) : new Date(t.date);
    return d >= monthStart;
  }).length;

  // Group by completion period
  const groups = {};
  filtered.forEach(t=>{
    let groupKey;
    let groupLabel;
    const compDate = t.completedAt ? new Date(t.completedAt) : parseDate(t.date);
    const today = new Date();
    today.setHours(0,0,0,0);
    const compDay = new Date(compDate);
    compDay.setHours(0,0,0,0);
    const diffDays = Math.floor((today - compDay) / 86400000);

    if(diffDays === 0){ groupKey='today'; groupLabel='今天完成'; }
    else if(diffDays === 1){ groupKey='yesterday'; groupLabel='昨天完成'; }
    else if(diffDays > 1 && diffDays <= 7){ groupKey='week'; groupLabel='本周早些时候'; }
    else if(diffDays > 7 && diffDays <= 30){ groupKey='month'; groupLabel='本月更早'; }
    else { groupKey='older'; groupLabel='更早'; }

    if(!groups[groupKey]) groups[groupKey] = {label:groupLabel, items:[]};
    groups[groupKey].items.push(t);
  });

  const groupOrder = ['today','yesterday','week','month','older'];

        <input type="text" placeholder="搜索已完成任务..." value="${escapeHtml(f.search)}" oninput="onArchiveSearch(this.value)">
      </div>
      <select class="filter-select" onchange="onArchiveFilter('category',this.value)">

function syncCompletedField(){
  const group = document.getElementById('f-completed-group');
  const input = document.getElementById('f-completed-date');
  const hint = document.getElementById('f-completed-hint');
  if(!group || !input) return;
  if(document.getElementById('f-status').value!=='completed'){ group.style.display = 'none'; return; }
  group.style.display = 'block';
  const t = state.editingId ? state.tasks.find(x=>x.id===state.editingId) : null;
  if(t && t.completedAt){
    input.value = dateStr(new Date(t.completedAt));

  } else {
    if(!input.value) input.value = todayStr();

  }
}

function saveTask(){
  const title = document.getElementById('f-title').value.trim();
  const date = document.getElementById('f-date').value;
  if(!title){ showToast('请输入任务标题'); return; }
  if(!date){ showToast('请选择日期'); return; }

  const data = {
    title,
    description: document.getElementById('f-desc').value.trim(),
    category: document.getElementById('f-category').value,
    priority: document.getElementById('f-priority').value,
    date,
    status: document.getElementById('f-status').value,
    startTime: document.getElementById('f-start').value,
    endTime: document.getElementById('f-end').value
  };
  const completedDateVal = document.getElementById('f-completed-date') ? document.getElementById('f-completed-date').value : '';

  if(state.editingId){
    const t = state.tasks.find(x=>x.id===state.editingId);
    if(t){
      Object.assign(t, data);
      untagDemo(t);          // 用户改过了，就不再是示例任务
      t.updatedAt = new Date().toISOString();
      if(data.status==='completed'){
        // 完成日期未改动则保留原完成时间；改动过则只替换年月日，保留原时分
        if(!t.completedAt) t.completedAt = composeCompletedAt(completedDateVal, null);
        else if(completedDateVal && dateStr(new Date(t.completedAt))!==completedDateVal) t.completedAt = composeCompletedAt(completedDateVal, t.completedAt);
      } else {
        t.completedAt = null;
      }
    }
    showToast('任务已更新');
  } else {
    const now = new Date().toISOString();
    state.tasks.push({
      id: uid(),
      ...data,
      createdAt: now,
      updatedAt: now,
      completedAt: data.status==='completed' ? composeCompletedAt(completedDateVal, null) : null
    });
  }
  saveTasks();
  closeModal();
  render();
}
function deleteCurrentTask(){
  if(state.editingId){
    deleteTask(state.editingId);
    closeModal();
  }
}
function deleteTask(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!isDemoTask(t)) markDeleted(id);   // 示例任务从没同步过，不必留删除记录
  state.tasks = state.tasks.filter(t=>t.id!==id);
  saveTasks();
  showToast('任务已删除');
  render();
}
function cycleStatus(id){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const order = ['pending','in-progress','completed'];
  const idx = order.indexOf(t.status);
  t.status = order[(idx+1)%3];
  untagDemo(t);            // 动过就是真任务了
  t.updatedAt = new Date().toISOString();
  t.completedAt = t.status==='completed' ? new Date().toISOString() : null;
  saveTasks();
  render();
}

function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('Invalid format');
      // 明确导入进来的都算真实任务，示例标记不跟着走
      data.forEach(t => { if(t && t.demo) delete t.demo; });
      if(state.tasks.length>0){
        if(!confirm('当前已有任务数据，是否覆盖？\n点击"取消"则追加导入。')){
          state.tasks = state.tasks.concat(data);
        } else {
          state.tasks = data;
        }
      } else {
        state.tasks = data;
      }
      saveTasks();
      render();
      showToast(`成功导入 ${data.length} 条任务`);
    }catch(err){
      showToast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
}

    if((e.ctrlKey||e.metaKey) && e.key==='n'){
      e.preventDefault();
      openModal();

    if((e.ctrlKey||e.metaKey) && e.key==='Enter' && document.getElementById('modalOverlay').classList.contains('active')){
      e.preventDefault();
      saveTask();

    if((e.ctrlKey||e.metaKey) && e.key==='s'){

      manualSyncNow();

      const views = {'1':'dashboard','2':'calendar','3':'tasks','4':'stats','5':'archive'};
      if(views[e.key]){ e.preventDefault(); switchView(views[e.key]); }
    }
  });

    if(e.target.id==='syncModalOverlay') closeSyncModal();

async function sendPhoneCode(){
  const el = document.getElementById('acctPhone');
  const phone = el ? el.value.trim() : '';
  if(!/^1\d{10}$/.test(phone)){ showToast('请输入 11 位手机号'); return; }
  const cloud = getCloud();
  if(!cloud){ showToast('账号服务没加载成功，检查下网络再试'); return; }
  syncState.status = 'syncing';
  syncState.message = '正在发送验证码…';
  renderSyncModal();
  try{
    const r = await cloud.auth.sendOtp({ phone: phone });
    if(r.error) throw new Error(r.error.message || '验证码发送失败');
    syncState.pendingOtp = {
      phone: phone,
      verificationId: r.data.verificationId,
      isExistingUser: !!r.data.isExistingUser
    };
    syncState.codeSentAt = Date.now();
    syncState.status = 'idle';

    renderSyncModal();

    showToast('验证码已发送');
  }catch(e){
    syncState.status = 'error';
    syncState.message = e.message || '验证码发送失败';
    syncState.codeSentAt = 0;
    renderSyncModal();
  }
}

function startCodeCountdown(){
  if(syncState.codeTimer){ clearInterval(syncState.codeTimer); syncState.codeTimer = null; }
  const tick = ()=>{
    const btn = document.getElementById('acctSendCode');
    if(!btn){ clearInterval(syncState.codeTimer); syncState.codeTimer = null; return; }
    const left = 60 - Math.floor((Date.now() - (syncState.codeSentAt || 0)) / 1000);
    if(left > 0){ btn.disabled = true; btn.textContent = left + 's'; }
    else { btn.disabled = false; btn.textContent = '获取验证码'; clearInterval(syncState.codeTimer); syncState.codeTimer = null; }
  };
  tick();
  syncState.codeTimer = setInterval(tick, 1000);
}

async function submitAuth(){
  const cloud = getCloud();
  if(!cloud){ showToast('账号服务没加载成功，检查下网络再试'); return; }
  const phoneEl = document.getElementById('acctPhone');
  const passEl = document.getElementById('acctPass');
  const codeEl = document.getElementById('acctCode');
  const phone = phoneEl ? phoneEl.value.trim() : '';
  const password = passEl ? passEl.value : '';
  const code = codeEl ? codeEl.value.trim() : '';
  const mode = syncState.mode;
  if(!/^1\d{10}$/.test(phone)){ showToast('请输入 11 位手机号'); return; }
  if(mode === 'login' && !password){ showToast('请输入密码'); return; }
  if(mode !== 'login' && !code){ showToast('请输入验证码'); return; }

  syncState.status = 'syncing';
  syncState.message = mode === 'register' ? '正在注册…' : '正在登录…';
  renderSyncModal();
  let existingUser = false;
  try{
    if(mode === 'login'){
      const r = await cloud.auth.signInWithPassword({ phone: phone, password: password });
      if(r.error) throw new Error(r.error.message || '手机号或密码不对');
    } else {
      const p = syncState.pendingOtp;
      if(!p || p.phone !== phone) throw new Error('请先点「获取验证码」');
      const args = {
        phone: phone,
        verificationId: p.verificationId,
        isExistingUser: p.isExistingUser,
        token: code
      };
      if(mode === 'register' && !p.isExistingUser){
        if(password.length < 6) throw new Error('密码至少 6 位');
        args.password = password;
      }
      existingUser = !!p.isExistingUser;
      const r = await cloud.auth.verifyOtp(args);
      if(r.error) throw new Error(r.error.message || '验证码不对或已过期');
      syncState.pendingOtp = null;
      syncState.codeSentAt = 0;
    }
    syncState.phone = phone;
    syncState.username = maskPhone(phone);
    syncState.loggedIn = true;
    syncState.status = 'idle';
    syncState.message = '';
    syncState.mode = 'login';
    try{ localStorage.setItem(HAD_ACCOUNT_KEY, '1'); }catch(e){}
    persistSyncConfig();
    renderSyncModal();
    const ok = await syncNow({silent:true});
    render();
    if(mode === 'register' && existingUser){
      showToast(ok ? '这个手机号本来就有账号，已用验证码登录' : (syncState.message || '已登录'));
    } else {
      showToast(ok ? (mode === 'register' ? '账号已创建，数据已同步' : '登录成功，数据已同步') : (syncState.message || '登录成功'));
    }
  }catch(e){
    syncState.status = 'error';
    syncState.message = (e && /验证码|手机号|密码|已过期/.test(String(e.message||''))) ? e.message : friendlySyncError(e);
    renderSyncModal();
    showToast(syncState.message);
  }
}

/* ---- 云数据库读写 ---- */
function mapDbError(e){
  const msg = String((e && (e.message || e.error_description)) || e || '数据同步失败');
  const code = e && (e.code || e.status);
  const err = new Error(msg);
  if(code === 'PGRST301' || code === 401 || /jwt|token|unauthor|not signed in/i.test(msg)) err.status = 401;
  else err.status = 500;
  return err;
}

async function fetchRemote(){
  const cloud = getCloud();
  if(!cloud) throw cloudMissing();
  const r = await cloud.database.from('spaces')
    .select('tasks, completed_total, tombstones, updated_at')
    .maybeSingle();
  if(r.error) throw mapDbError(r.error);
  if(!r.data) return { data: null, stamp: null };
  return {
    data: {
      tasks: r.data.tasks || [],
      deleted: r.data.tombstones || {},
      completedTotal: r.data.completed_total || 0
    },
    stamp: r.data.updated_at
  };
}

// 乐观锁：带着上次读到的 updated_at 去更新，被别人抢先改过就会一行都没更新到，返回 conflict
async function pushRemote(payload, stamp){
  const cloud = getCloud();
  if(!cloud) throw cloudMissing();
  const row = {
    tasks: payload.tasks,
    tombstones: payload.deleted || {},
    completed_total: payload.completedTotal || 0,
    updated_at: new Date().toISOString()
  };
  if(!stamp){
    const r = await cloud.database.from('spaces').insert(row);
    if(r.error){
      const blob = String(r.error.code || '') + ' ' + String(r.error.message || '');
      if(/23505|duplicate|conflict/i.test(blob)) return { conflict: true };
      throw mapDbError(r.error);
    }
    return { conflict: false };
  }
  const r = await cloud.database.from('spaces')
    .update(row)
    .eq('updated_at', stamp)
    .select('updated_at');
  if(r.error) throw mapDbError(r.error);
  return { conflict: !r.data || r.data.length === 0 };
}

function taskStamp(t){
  return t.updatedAt || t.createdAt || t.completedAt || '1970-01-01T00:00:00.000Z';
}

// 合并规则：同一任务取更新时间较新的一份；删除记录也取较新的，避免删掉的任务被另一台设备"复活"
function mergeSyncData(localTasks, localDeleted, remoteTasks, remoteDeleted){
  const deleted = {};
  [remoteDeleted||{}, localDeleted||{}].forEach(src=>{
    for(const k in src){ if(!deleted[k] || src[k] > deleted[k]) deleted[k] = src[k]; }
  });
  const best = {};
  (remoteTasks||[]).concat(localTasks||[]).forEach(t=>{
    if(!t || !t.id) return;
    const st = taskStamp(t);
    if(!best[t.id] || st > best[t.id].st) best[t.id] = {t:t, st:st};
  });
  const tasks = [];
  for(const id in best){
    const del = deleted[id];
    if(del && del >= best[id].st) continue;
    tasks.push(best[id].t);
  }
  return {tasks:tasks, deleted:deleted};
}

async function doSyncRound(attempt){
  const remote = await fetchRemote();
  const rd = (remote.data && typeof remote.data==='object') ? remote.data : {tasks:[], deleted:{}};
  // 示例任务只在本地撑场面：不参与合并、不上传；远端若残留也一并剔除
  const merged = mergeSyncData(syncableTasks(state.tasks), getTombstones(), syncableTasks(rd.tasks), rd.deleted);
  const remoteTotal = parseInt(rd.completedTotal || 0, 10) || 0;
  if(remoteTotal > getCompletedTotal()) localStorage.setItem(COMPLETED_COUNT_KEY, String(remoteTotal));
  const payload = {
    tasks: merged.tasks,
    deleted: merged.deleted,
    completedTotal: getCompletedTotal()
  };
  let res = null;
  try{
    res = await pushRemote(payload, remote.stamp);
  }catch(e){
    if(attempt < 2 && !(e && e.status === 401)){
      await new Promise(r=>setTimeout(r, 700));
      return doSyncRound(attempt+1);
    }
    throw e;
  }
  if(res && res.conflict){
    // 另一台设备刚刚写过：重新读一遍再合并，避免互相覆盖
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, 400));
      return doSyncRound(attempt+1);
    }
    throw new Error('另一台设备正在更新，稍后会自动再同步');
  }
  const before = JSON.stringify(state.tasks);
  const after = JSON.stringify(merged.tasks);
  const changed = before !== after;
  state.tasks = merged.tasks;
  localStorage.setItem(STORAGE_KEY, after);
  setTombstones(merged.deleted || {});
  return {changed:changed, count:merged.tasks.length};
}

async function syncNow(opts){
  opts = opts || {};
  if(!syncState.loggedIn || syncState.busy) return false;
  syncState.busy = true;
  if(!opts.silent){ syncState.status='syncing'; syncState.message='正在同步…'; renderSyncModal(); }
  let ok = false;
  try{
    const r = await doSyncRound(0);
    syncState.status = 'success';
    syncState.message = r.changed ? '已同步 · 本机更新为 ' + r.count + ' 条任务' : '已同步 · 数据已是最新';
    syncState.lastSyncAt = new Date().toISOString();
    persistSyncConfig();
    if(r.changed) render();
    ok = true;
  }catch(e){
    syncState.status = 'error';
    syncState.message = friendlySyncError(e);
    if(e && e.status === 401){ syncState.loggedIn = false; persistSyncConfig(); }
    console.warn('同步失败:', e);
  }
  syncState.busy = false;
  renderSyncModal();
  return ok;
}

function friendlySyncError(e){
  const msg = String((e && e.message) || e);
  const st = e && e.status;
  if(st === 401) return '登录已过期，请重新登录';
  if(st === 0) return msg;
  if(/Failed to fetch|NetworkError|Load failed|network|timeout/i.test(msg)) return '网络不通，稍后自动重试';
  return msg;
}

function debounceSyncPush(){
  if(!syncState.loggedIn) return;
  if(syncState.pushTimer) clearTimeout(syncState.pushTimer);
  syncState.pushTimer = setTimeout(()=>{ syncNow({silent:true}); }, 2500);
}

/* ====== Sync UI ====== */
function relativeSyncTime(iso){
  const diff = Date.now() - new Date(iso).getTime();
  if(isNaN(diff)) return '未知';
  if(diff < 60000) return '刚刚';
  if(diff < 3600000) return Math.floor(diff/60000) + ' 分钟前';
  if(diff < 86400000) return Math.floor(diff/3600000) + ' 小时前';
  return Math.floor(diff/86400000) + ' 天前';
}
function openSyncModal(){
  const el = document.getElementById('syncModalOverlay');
  if(!el) return;
  renderSyncModal();
  el.classList.add('active');
  if(syncState.loggedIn && !syncState.busy) syncNow({silent:true});
}
function closeSyncModal(){
  const el = document.getElementById('syncModalOverlay');
  if(el) el.classList.remove('active');
}
function switchSyncMode(mode){
  syncState.mode = (mode === 'register' || mode === 'otp') ? mode : 'login';
  syncState.status = 'idle';
  syncState.message = '';
  renderSyncModal();
}
function accountLabel(){
  return syncState.username || '未登录';
}

function renderSyncModal(){
  const body = document.getElementById('syncModalBody');
  const footer = document.getElementById('syncModalFooter');
  if(!body || !footer) return;

  /* ---------- 未登录：登录 / 注册 ---------- */
  if(!syncState.loggedIn){
    const mode = syncState.mode || 'login';
    const isReg = mode === 'register';
    const isOtp = mode === 'otp';
    const err = (syncState.status === 'error' && syncState.message)
      ? '<div class="sync-status error"><div class="sync-dot err"></div><div class="sync-status-text">' + escapeHtml(syncState.message) + '</div></div>'
      : '';
    const phoneVal = savedPhone();
    let html = err
      + '<div class="sync-lead">登录同一个账号，你的电脑和手机就会看到同一份任务。</div>'
      + '<div class="sync-tabs">'
      + '<button class="sync-tab' + (!isReg ? ' active' : '') + '" onclick="switchSyncMode(\'login\')">登录</button>'
      + '<button class="sync-tab' + (isReg ? ' active' : '') + '" onclick="switchSyncMode(\'register\')">注册</button>'
      + '</div>'
      + '<div class="sync-form-item">'
      + '<label class="sync-form-label">手机号</label>'
      + '<input class="sync-form-input" id="acctPhone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" value="' + escapeHtml(phoneVal) + '" placeholder="11 位手机号">'
      + '</div>';

    if(!isReg && !isOtp){
      html += '<div class="sync-form-item">'
        + '<label class="sync-form-label">密码</label>'
        + '<input class="sync-form-input" id="acctPass" type="password" autocomplete="current-password" placeholder="你的密码">'
        + '</div>';
    } else {
      html += '<div class="sync-form-item">'
        + '<label class="sync-form-label">验证码</label>'
        + '<div style="display:flex;gap:8px;align-items:center">'
        + '<input class="sync-form-input" id="acctCode" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位验证码" style="flex:1">'
        + '<button class="btn btn-cancel" id="acctSendCode" type="button" onclick="sendPhoneCode()" style="white-space:nowrap;min-width:96px">获取验证码</button>'
        + '</div></div>';
      if(isReg){
        html += '<div class="sync-form-item">'
          + '<label class="sync-form-label">设置密码</label>'
          + '<input class="sync-form-input" id="acctPass" type="password" autocomplete="new-password" placeholder="至少 6 位，以后用它登录">'
          + '</div>';
      }
    }

    if(mode === 'login'){
      html += '<div class="sync-tip">还没注册？点上面的「注册」，用手机号收个验证码就行。<br>'
        + '<a href="javascript:void(0)" onclick="switchSyncMode(\'otp\')" style="color:inherit;text-decoration:underline">忘记密码？用验证码登录</a></div>';
    } else if(mode === 'otp'){
      html += '<div class="sync-tip">用短信验证码直接登录，不用输密码。<br>'
        + '<a href="javascript:void(0)" onclick="switchSyncMode(\'login\')" style="color:inherit;text-decoration:underline">改用密码登录</a></div>';
    } else {
      html += '<div class="sync-tip">注册好之后，在别的设备上用同一个手机号登录，就能看到同一份任务。</div>';
    }

    body.innerHTML = html;
    const btnText = isReg ? '注册并登录' : (isOtp ? '验证码登录' : '登录');
    footer.innerHTML = '<button class="btn btn-cancel" onclick="closeSyncModal()">关闭</button>'
      + '<button class="btn btn-save" onclick="submitAuth()">' + btnText + '</button>';
    ['acctPass','acctCode','acctPhone'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submitAuth(); });
    });
    if(syncState.codeSentAt && (isReg || isOtp)) startCodeCountdown();
    return;
  }

  /* ---------- 已登录 ---------- */
  const cls = syncState.status==='success' ? 'success' : syncState.status==='error' ? 'error' : syncState.status==='syncing' ? 'syncing' : '';
  const dot = syncState.status==='syncing'
    ? '<div class="sync-spinner"></div>'
    : '<div class="sync-dot ' + (syncState.status==='success' ? 'ok' : syncState.status==='error' ? 'err' : 'idle') + '"></div>';
  const text = syncState.message || '已登录';
  const last = syncState.lastSyncAt ? relativeSyncTime(syncState.lastSyncAt) : '尚未同步';

  body.innerHTML = '<div class="sync-status ' + cls + '">' + dot + '<div class="sync-status-text">' + escapeHtml(text)
    + '<br><span style="font-size:12px;opacity:.75">账号：' + escapeHtml(accountLabel()) + ' ｜ 上次同步：' + last + '</span></div></div>'
    + '<div class="sync-guide">'
    + '<div class="sync-guide-title">怎么让另一台设备也同步</div>'
    + '<div class="sync-guide-step"><div class="sync-guide-num">1</div><div>在另一台设备上打开同一个网址</div></div>'
    + '<div class="sync-guide-step"><div class="sync-guide-num">2</div><div>输入同一个手机号和密码，点「登录」</div></div>'
    + '<div class="sync-guide-step"><div class="sync-guide-num">3</div><div>之后两边自动同步，改动约 3 秒后送达</div></div>'
    + '</div>'
    + '<div class="sync-warn">任务存在你专属的云端空间里，只有登录这个账号的设备能看到。手机号和密码别发给外人。</div>';
  footer.innerHTML = '<button class="btn btn-danger" style="margin-right:auto" onclick="doLogout()">退出登录</button>'
    + '<button class="btn btn-cancel" onclick="closeSyncModal()">关闭</button>'
    + '<button class="btn btn-save" onclick="manualSyncNow()">立即同步</button>';
}

async function manualSyncNow(){
  syncState.status = 'syncing';
  syncState.message = '正在同步…';
  renderSyncModal();
  const ok = await syncNow({silent:true});
  showToast(ok ? '同步完成' : (syncState.message || '同步失败'));
}

/* ====== Init ====== */
function init(){
  loadTasks();
  loadSyncConfig();
  if(localStorage.getItem(COMPLETED_COUNT_KEY)===null){
    localStorage.setItem(COMPLETED_COUNT_KEY, String(state.tasks.filter(t=>t.status==='completed' && !isDemoTask(t)).length));
  }
  bindEvents();
  render();
  // 登录状态存在云端会话里，需要异步恢复；恢复成功才自动同步
  restoreSession().then((logged)=>{
    if(logged){
      syncState.status = 'idle';
      syncState.message = '';
      renderSyncModal();
      syncNow({silent:true});
    } else if(state.tasks.length===0 && !localStorage.getItem(HAD_ACCOUNT_KEY)){
      // 示例任务只在「从没用过账号、而且本机真的空」的设备上出现
      addSampleTasks();
      render();
    }
  });
  // 从后台切回前台时补一次同步
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && syncState.loggedIn && !syncState.busy){
      const last = syncState.lastSyncAt ? new Date(syncState.lastSyncAt).getTime() : 0;
      if(Date.now() - last > 20000) syncNow({silent:true});
    }
  });
}

init();

/* ====== PWA 离线缓存（仅 HTTPS 生效） ====== */
if('serviceWorker' in navigator && location.protocol.startsWith('https')){
  var _sc = new URLSearchParams(location.search).get('sharecode');
  navigator.serviceWorker.register('sw.js' + (_sc ? ('?sharecode=' + encodeURIComponent(_sc)) : '')).catch(()=>{});
}
